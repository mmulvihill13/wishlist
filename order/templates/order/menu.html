{% extends 'base.html' %}

{% load static %}

{% block content %}
    <link rel="stylesheet" href="{% static 'css/menu.css' %}">
    <link rel="stylesheet" href="{% static 'css/menu.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"> 
    <div class="cart-container">
        <a href="{% url 'cart' %}" class="cart-button"><i class="bi bi-cart"></i>Cart(0)</a>
    </div>

    <h1>Our Menu</h1>
    <div class="element"></div>

    <h1 class="types">Cold Drinks</h1>
    <div class="grid-container"> 
        {% for drink in coldDrinks %}
            <a href="{% url 'order:detailed_menu' drink.name%}" class="grid-item">
                <div class="drink-img">
                    <img src="{% static '/images/coffeeEx.jpg' %}" alt="Coffee Example">
                </div>
                <div class="drink-info">
                    {{ drink.name }}
                    <br>
                    ${{ drink.price }}
                </div>
            </a>
        {% endfor %}
    </div>

    <h1 class="types">Hot Drinks</h1>
        <div class="grid-container">
        {% for drink in hotDrinks %}
        <a href="{% url 'order:detailed_menu' drink.name %}" class="grid-item">
            <div class="drink-img">
                <img src="{% static '/images/coffeeEx.jpg' %}" alt="Coffee Example">
            </div>
            <div class="drink-info">
                {{ drink.name }}
                <br>
                ${{ drink.price }}
            </div>
        </a>
        {% endfor %}
    </div>
    <div class="space"></div>
{% endblock %}

<script>
</script>
