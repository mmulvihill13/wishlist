{% extends 'base.html' %}

{% load static %}

{% block content %}
    <link rel="stylesheet" href="{% static 'css/menu.css' %}">
    <h1>Our Menu</h1>

    <div class="grid-container">
            {% for drink in drinks %}
                <div class="grid-item">
                    <div class="drink-img">
                        <img src="{% static '/images/coffeeEx.jpg' %}" alt="Coffee Example">
                    </div>
                    <div class="drink-info">
                        {{ drink.name }} - ${{ drink.price }}
                    </div>
                </div>
            {% endfor %}
    </div>
{% endblock %}
